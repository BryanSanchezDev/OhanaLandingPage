name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      # Building the app ourselves here (instead of letting the deploy
      # action's Oryx build container do it) because the build now includes
      # a Puppeteer-based prerender step (scripts/prerender.mjs) that needs
      # a full Chromium + its system libraries — the standard GitHub-hosted
      # ubuntu-latest runner has what that needs; Oryx's build container is
      # not guaranteed to. See CLAUDE.md's Standalone pages / build notes.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install app dependencies
        run: npm ci
      - name: Build app (includes prerender)
        run: npm run build
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_STONE_079489510 }}
          action: "upload"
          skip_app_build: true
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          # NOTE: with skip_app_build true, Azure uploads directly from
          # app_location — it does NOT apply output_location (that only
          # matters when Oryx runs the app build itself). Since we already
          # built to dist/ ourselves above, app_location must point there.
          app_location: "dist" # Prebuilt app content path (we build it ourselves, see steps above)
          api_location: "api" # Api source code path - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
